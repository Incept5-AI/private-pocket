name: PrivatePocket

# Generated with `xcodegen generate`; the .xcodeproj is not checked in.
# Build + install: see README.md.

options:
  bundleIdPrefix: com.incept5
  deploymentTarget:
    iOS: "27.0"
  xcodeVersion: "27.0"

targets:
  PrivatePocket:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: Generated
        optional: true
      - path: Samples/SampleMoments
        type: folder
        buildPhase: resources
    dependencies:
      - target: PrivatePocketWidgets
    preBuildScripts:
      - name: Generate default device from ../../ble/.env
        script: |
          "$SRCROOT/gen-defaults.sh"
        outputFiles:
          - $(SRCROOT)/Generated/DefaultDevice.swift
        basedOnDependencyAnalysis: false
    settings:
      base:
        # Either set your team here (or in Xcode) and run from Xcode, or build
        # unsigned and sign with sign-install.sh (see signing.env.example).
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.incept5.private-pocket
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Private Pocket
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Connects to your Pocket recorder to list, record and download recordings. Nothing leaves this phone."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Tags each recording with where it was made. Stays on this phone."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Transcribes your recordings on this iPhone."
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    info:
      path: App/Info.plist
      properties:
        UIBackgroundModes: [bluetooth-central, audio]
        # The brand is dark: a graphite ground, cyan for anything you can tap, amber for recording.
        UIUserInterfaceStyle: Dark
        # Dynamic Island and Lock Screen while the Pocket records (PrivatePocketWidgets).
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # Reminders and Calendar, only when the user taps Add on an action or a date.
        NSRemindersFullAccessUsageDescription: "Adds actions found in your recordings to Reminders, only when you tap Add."
        NSCalendarsFullAccessUsageDescription: "Adds events found in your recordings to Calendar, only when you tap Add."
        NSRemindersUsageDescription: "Adds actions found in your recordings to Reminders, only when you tap Add."
        NSCalendarsUsageDescription: "Adds events found in your recordings to Calendar, only when you tap Add."
        # Lets the language model setting point at a plain-http server on a private network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  # The Live Activity (Dynamic Island, Lock Screen). Shares Shared/ with the app.
  PrivatePocketWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.incept5.private-pocket.widgets
        CODE_SIGN_ENTITLEMENTS: Widgets/PrivatePocketWidgets.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Private Pocket
    info:
      path: Widgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
